# Mini validation config: DCTCP on two-switch incast bottleneck.
enable_qcn: true
use_dynamic_pfc_threshold: true
pause_time: 5
packet_payload_size: 1000
l2_chunk_size: 4000
l2_ack_interval: 1
l2_back_to_zero: false
topology_file: algorithm-validation/topologies/two_switch_6host.txt
flow_file: algorithm-validation/flows/incast_bottleneck.txt
trace_file: algorithm-validation/traces/all_nodes.txt
trace_output_file: algorithm-validation/output/dctcp_incast/trace.tr
fct_output_file: algorithm-validation/output/dctcp_incast/fct.txt
pfc_output_file: algorithm-validation/output/dctcp_incast/pfc.txt
bottleneck_output_file: algorithm-validation/output/dctcp_incast/bottleneck.txt
simulator_stop_time: 0.2
cc_mode: 8
alpha_resume_interval: 1.0
rate_decrease_interval: 4.0
clamp_target_rate: false
rp_timer: 300.0
ewma_gain: 0.0625
fast_recovery_times: 1
rate_ai: 10Mb/s
rate_hai: 10Mb/s
min_rate: 1000Mb/s
dctcp_rate_ai: 615Mb/s
error_rate_per_link: 0.0
has_win: 1
global_t: 1
var_win: true
fast_react: false
u_target: 0.95
mi_thresh: 0
int_multi: 1
multi_rate: false
sample_feedback: false
pint_log_base: 1.05
pint_prob: 1.0
rate_bound: true
ack_high_prio: 0
link_down:
