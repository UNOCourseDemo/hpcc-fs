  from_node: 0
  to_node: 0
enable_trace: 0
kmax_map:
  25000000000: 75
  100000000000: 300
kmin_map:
  25000000000: 75
  100000000000: 300
pmax_map:
  25000000000: 1.0
  100000000000: 1.0
buffer_size: 4
qlen_mon_file: algorithm-validation/output/dctcp_incast/qlen.txt
qlen_dump_interval: 1000000
qlen_mon_interval: 10000
qlen_mon_start: 0
qlen_mon_end: 200000000
